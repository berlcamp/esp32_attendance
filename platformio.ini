; ESP32-S3 RFID Attendance Gate — simulation build
; Board detected on this machine: ESP32-S3 rev0.2, 16MB flash, 8MB PSRAM,
; native USB-Serial/JTAG on /dev/cu.usbmodem101

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
; Firmware target
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
; 16MB quad flash + 8MB OCTAL PSRAM -> qio_opi. Wrong value here
; makes PSRAM probe fail at boot with 'PSRAM chip not found'.
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs

upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  ; Native USB CDC — required for Serial over USB-JTAG on the S3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  bblanchon/ArduinoJson@^7.2.0

; ---------------------------------------------------------------------------
; Host target — queue / backoff logic tested on the Mac, no flashing
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
  -std=gnu++17
  -DUNIT_TEST
